[ubuntu-dev] 
image=quay.io/toolbx/ubuntu-toolbox:latest 
additional_packages="software-properties-common dotnet-sdk-8.0 aspnetcore-runtime-8.0 pass build-essential dotnet-sdk-10.0 aspnetcore-runtime-10.0" 
nvidia=true 
volume="/home/linuxbrew:/home/linuxbrew $(which fnm):$(which fnm) $(which docker):$(which docker) $(which docker-compose):$(which docker-compose) $(which docker-credential-pass):$(which docker-credential-pass) /usr/libexec/docker/cli-plugins/docker-buildx:/usr/libexec/docker/cli-plugins/docker-buildx /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose" 
replace=true 
root=false
